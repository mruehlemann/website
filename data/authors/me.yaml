bio: |
  Malte Rühlemann is a postdoctoral researcher at the Institute of Clinical Molecular Biology, UKSH & CAU Kiel. His research focuses on human host–microbiome systems, microbiome ecology, metagenomics, inflammatory bowel disease, and computational analysis of large-scale microbiome datasets. He is Project PI within the DFG-funded CRC1182 “Origin and Function of Metaorganisms” and leads major data processing and meta-analysis efforts in the EU-funded miGut-Health project.

